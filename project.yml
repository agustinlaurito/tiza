name: TeachBoard
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.personal.TeachBoard
    PRODUCT_NAME: TeachBoard
    INFOPLIST_KEY_CFBundleDisplayName: TeachBoard
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.education"

targets:
  TeachBoard:
    type: application
    platform: macOS
    sources:
      - TeachBoard
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: TeachBoard/Resources/TeachBoard.entitlements
        INFOPLIST_KEY_NSDocumentClass: "$(PRODUCT_MODULE_NAME).TeachBoardDocument"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    info:
      path: TeachBoard/Resources/Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: TeachBoard Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.teachboard.document
            NSDocumentClass: $(PRODUCT_MODULE_NAME).TeachBoardDocument
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.teachboard.document
            UTTypeDescription: TeachBoard Document
            UTTypeConformsTo:
              - com.apple.package
            UTTypeTagSpecification:
              public.filename-extension:
                - teachboard

  TeachBoardTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TeachBoardTests
    dependencies:
      - target: TeachBoard
        embed: false
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TeachBoard.app/Contents/MacOS/TeachBoard"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_MODULE_NAME: TeachBoardTests
        SWIFT_EMIT_MODULE_INTERFACE: NO
