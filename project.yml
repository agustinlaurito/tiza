name: Tiza
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.personal.Tiza
    PRODUCT_NAME: Tiza
    INFOPLIST_KEY_CFBundleDisplayName: Tiza
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.education"

targets:
  Tiza:
    type: application
    platform: macOS
    sources:
      - Tiza
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Tiza/Resources/Tiza.entitlements
        INFOPLIST_KEY_NSDocumentClass: "$(PRODUCT_MODULE_NAME).TizaDocument"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    info:
      path: Tiza/Resources/Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: Tiza Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.tiza.document
            NSDocumentClass: $(PRODUCT_MODULE_NAME).TizaDocument
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.tiza.document
            UTTypeDescription: Tiza Document
            UTTypeConformsTo:
              - com.apple.package
            UTTypeTagSpecification:
              public.filename-extension:
                - tiza

  TizaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TizaTests
    dependencies:
      - target: Tiza
        embed: false
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tiza.app/Contents/MacOS/Tiza"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_MODULE_NAME: TizaTests
        SWIFT_EMIT_MODULE_INTERFACE: NO
